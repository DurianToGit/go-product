version: "3.8"


services:
  mysql:
    image: mysql:8
    container_name: product_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: product_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql


  product-service:
    build: ./product-service
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      DB_USER1: root
      DB_PASS1: 123456
      DB_HOST1: mysql
      DB_PORT1: 3306
      DB_NAME1: product_db


  volumes:
    db_data: