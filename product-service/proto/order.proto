syntax = "proto3";

package order;

option go_package = "product-service/pkg/pb/orderpb";

service OrderService {
    rpc Create (CreateRequest) returns (CreateResponse) {}
    rpc Cancel (CancelRequest) returns (CancelResponse) {}
    rpc Get (GetRequest) returns (GetResponse) {}
    rpc Pay (PayRequest) returns (PayResponse) {}
}

message OrderPaidEvent {
    int64 order_id = 1;
    int64 user_id = 2;
    int64 amount = 3;
    int64 paid_at = 4;
}

message OrderCanceledEvent {
    int64 order_id = 1;
    int64 user_id = 2;
    int64 product_id = 3;
    int64 count = 4;
    string reason = 5;
    int64 canceled_at = 6;
}

message CreateRequest {
    int64 user_id = 1;
    int64 product_id = 2;
    int64 count = 3;
    string idem_key = 4;
}

message CreateResponse {
    int64 id = 1;
    string order_no = 2;
    int64 user_id = 3;
    int64 product_id = 4;
    int64 count = 5;
    int64 amount = 6;
    string status = 7;
    string idem_key = 8;
}

message CancelRequest {
    int64 order_id = 1;
    string reason = 2;
}

message CancelResponse {
    bool success = 1;
}

message GetRequest {
    int64 order_id = 1;
}

message GetResponse {
    int64 id = 1;
    string order_no = 2;
    int64 user_id = 3;
    int64 product_id = 4;
    int64 count = 5;
    int64 amount = 6;
    string status = 7;
}

message PayRequest {
    int64 order_id = 1;
}

message PayResponse {
    bool success = 1;
}