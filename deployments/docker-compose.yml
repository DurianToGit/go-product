version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: go-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: go_product
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    container_name: go-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: go-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: go-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  product-api:
    build:
      context: .
      dockerfile: deployments/docker/product-api.Dockerfile
    depends_on:
      - mysql
      - redis
    environment:
      ENV: prod
      PRODUCT_GRPC_ADDR: ":9002"
      PRODUCT_GRPC: "true"
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: go_product
      REDIS_ADDR: redis:6379

  order-api:
    build:
      context: .
      dockerfile: deployments/docker/order-api.Dockerfile
    depends_on:
      - mysql
      - redis
      - kafka
      - product-api
    environment:
      ENV: prod
      ORDER_GRPC_ADDR: ":9003"
      PRODUCT_GRPC_ADDR: product-api:9002
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: go_product
      REDIS_ADDR: redis:6379
      KAFKA_ADDR: kafka:9092

  user-api:
    build:
      context: .
      dockerfile: deployments/docker/user-api.Dockerfile
    depends_on:
      - mysql
    environment:
      ENV: prod
      USER_GRPC_ADDR: ":9001"
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: go_product

  gateway:
    build:
      context: .
      dockerfile: deployments/docker/gateway.Dockerfile
    depends_on:
      - user-api
      - product-api
      - order-api
    ports:
      - "8080:8080"
    environment:
      ENV: prod
      ADDR: ":8080"
      PRODUCT_GRPC_ADDR: product-api:9002
      ORDER_GRPC_ADDR: order-api:9003
      USER_GRPC_ADDR: user-api:9001

  order-worker:
    build:
      context: .
      dockerfile: deployments/docker/order-worker.Dockerfile
    depends_on:
      - mysql
      - kafka
      - product-api
    environment:
      ENV: prod
      DB_USER: root
      DB_PASS: root
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: go_product
      KAFKA_ADDR: kafka:9092
      PRODUCT_GRPC_ADDR: product-api:9002
